<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=1920">
<title>Reframe compatibility check</title>
<style>
  body { background:#101821; color:#eef3f8; font:28px sans-serif; padding:48px; }
  pre { white-space:pre-wrap; font:22px monospace; }
</style>
<h1>Reframe compatibility check</h1>
<p>Checking bridge access with read-only requests, then closing diagnostic windows.</p>
<pre id="output"></pre>
<script>
(function () {
  var output = document.getElementById('output');
  var report = { phase:'loaded', bridges:{
    PalmServiceBridge:typeof window.PalmServiceBridge,
    webOSServiceBridge:typeof window.webOSServiceBridge
  }, results:[] };
  var liveBridges = [];
  var appMatch = /[?&]app=([^&]+)/.exec(location.search);
  var appId = appMatch ? decodeURIComponent(appMatch[1]) : '';
  report.identifier = window.PalmSystem ? String(window.PalmSystem.identifier || '') : '';

  function publish() {
    output.textContent = JSON.stringify(report, null, 2);
    var request = new XMLHttpRequest();
    request.open('POST', '/result' + location.search, true);
    request.setRequestHeader('Content-Type', 'application/json');
    if (report.phase === 'finished') {
      request.onload = function () {
        // Close only this diagnostic app after the report reaches the laptop.
        setTimeout(function () {
          var Constructor = typeof window.webOSServiceBridge === 'function'
            ? window.webOSServiceBridge : window.PalmServiceBridge;
          try {
            var closer = new Constructor();
            liveBridges.push(closer);
            closer.onservicecallback = function () {};
            closer.call('luna://com.webos.applicationManager/closeByAppId', JSON.stringify({id:appId}));
          } catch (ignore) {}
          setTimeout(function () { window.close(); }, 500);
        }, 200);
      };
    }
    request.send(JSON.stringify(report));
  }

  function read(uri, params, done) {
    var Constructor = typeof window.webOSServiceBridge === 'function'
      ? window.webOSServiceBridge : window.PalmServiceBridge;
    if (typeof Constructor !== 'function') {
      report.results.push({ uri:uri, error:'Native bridge unavailable' });
      done();
      return;
    }
    var bridge;
    try { bridge = new Constructor(); }
    catch (error) {
      report.results.push({ uri:uri, error:String(error) });
      done();
      return;
    }
    liveBridges.push(bridge);
    var finished = false;
    var timer;
    function finish(result) {
      if (finished) return;
      finished = true;
      clearTimeout(timer);
      report.results.push(result);
      try { bridge.cancel(); } catch (ignore) {}
      done();
    }
    bridge.onservicecallback = function (raw) {
      var response;
      try { response = JSON.parse(raw); }
      catch (error) { response = {error:'Non-JSON bridge reply'}; }
      finish({ uri:uri, response:response });
    };
    timer = setTimeout(function () { finish({uri:uri, error:'No reply within 4 seconds'}); }, 4000);
    try { bridge.call(uri, JSON.stringify(params)); }
    catch (error) { finish({uri:uri, error:String(error)}); }
  }

  publish();
  read('luna://com.webos.service.tv.systemproperty/getSystemInfo', {keys:['sdkVersion']}, function () {
    read('luna://com.webos.applicationManager/getForegroundAppInfo', {}, function () {
      // Permission introspection only: jsserver/run is data, never invoked.
      read('luna://com.webos.service.bus/isCallAllowed', {
        requester:appId,
        uri:'luna://com.webos.service.jsserver/run'
      }, function () {
        // Calibrate policy introspection against the request that just succeeded.
        read('luna://com.webos.service.bus/isCallAllowed', {
          requester:appId,
          uri:'luna://com.webos.applicationManager/getForegroundAppInfo'
        }, function () {
          read('luna://com.webos.service.bus/queryServicePermissions', {
            service:appId
          }, function () {
            read('luna://com.webos.service.bus/queryServicePermissions', {
              service:'com.webos.service.jsserver'
            }, finishChecks);
          });
        });
      });

      function finishChecks() {
        function finish() { report.phase = 'finished'; publish(); }
        if (appId === 'com.webos.app.adoverlay') {
          // Clean up only the previous Reframe diagnostic, never another app.
          read('luna://com.webos.applicationManager/closeByAppId', {
            id:'com.webos.app.adoverlayex'
          }, function () {
            read('luna://com.webos.applicationManager/closeByAppId', {
              id:'com.webos.app.dangbei-overlay'
            }, finish);
          });
        } else {
          finish();
        }
      }
    });
  });
})();
</script>
</html>
